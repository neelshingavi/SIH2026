version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi_password
      POSTGRES_DB: hapi
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:postgresql://db:5432/hapi
      - spring.datasource.username=hapi
      - spring.datasource.password=hapi_password
    depends_on:
      - db

  core-gateway:
    build: 
      context: ./core-gateway/api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=hapi
      - DB_PASSWORD=hapi_password
      - DB_NAME=hapi
      - NODE_ENV=development
      - HAPI_FHIR_URL=http://hapi-fhir:8080/fhir
    depends_on:
      - db

  portals:
    build:
      context: ./portals
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - core-gateway

volumes:
  pgdata:
